<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>H2H 9-Cat Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Fan-built concept: head-to-head 9-category fantasy basketball (redraft + dynasty), designed to slot into Sleeper.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700;900&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: host-app shell — 240px nav sidebar | league column (header + rounded panel with pill tabs) | League Chat panel.
   Single dark theme by design: the palette below was sampled from the host app's web client (computed styles). */
:root {
  --page: #181c28;
  --side: #1f2431;
  --panel: rgba(58, 70, 91, 0.5);
  --card: rgba(163, 187, 211, 0.05);
  --card-2: rgba(163, 187, 211, 0.09);
  --raise: #2d3649;
  --chip: #262e3e;
  --line: rgba(163, 187, 211, 0.12);
  --fg: #ffffff;
  --soft: #d8e2ed;
  --muted: #a3bbd3;
  --dim: #7988a1;
  --sub: #b9c4d4;
  --teal: #00ceb8;
  --teal-ink: #022047;
  --teal-10: rgba(0, 206, 184, 0.1);
  --sport: #ffae58;            /* the host app's NBA accent (league tabs) */
  --sport-10: rgba(255, 174, 88, 0.1);
  --pink: #ff2a6d;
  --blue: #58a7ff;
  --orange: #ffae58;
  --purple: #6d7df5;
  --gold: #f9c74f;
  --c-pg: var(--pink); --c-sg: var(--blue); --c-sf: var(--teal); --c-pf: var(--orange); --c-c: var(--purple);
  --font-head: "Poppins", "Segoe UI", Arial, sans-serif;
  --font-data: "Inter", "Segoe UI", Arial, sans-serif;
  --font-base: "Lato", Arial, Helvetica, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--page); color: var(--fg); font-family: var(--font-base); font-size: 14px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
input, select { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.data { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.teal { color: var(--teal); }
.pink { color: var(--pink); }
.spacer { flex: 1; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.nowrap { flex-wrap: nowrap; }
.h-label { font-family: var(--font-head); font-size: 16px; font-weight: 500; }
.cap { font-family: var(--font-head); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1.45fr) minmax(300px, 0.6fr); height: 100%; }
.promo { background: #fff; color: #102131; border-radius: 4px; margin: 14px 2px 4px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.promo-t { font-family: var(--font-base); font-weight: 900; font-size: 15px; }
.promo-b { font-family: var(--font-base); font-size: 12px; line-height: 1.4; color: #2b3a4a; }
.promo-a { display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; }
.promo .btn { background: #fff; color: #102131; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.promo .btn.teal { background: var(--teal); color: var(--teal-ink); box-shadow: none; }
.clock.mclock { display: none; }
.side { background: var(--side); display: flex; flex-direction: column; min-height: 0; }
.brand { height: 84px; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
.brand img { max-height: 30px; max-width: 150px; }
.brand-mark { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb46b, #f07a1a 60%, #b8520c); position: relative; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.brand-mark::before, .brand-mark::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(40, 18, 4, .55); clip-path: inset(0 48% 0 48%); }
.brand-mark::after { clip-path: inset(48% 0 48% 0); }
.brand-txt { font-family: var(--font-head); font-weight: 700; font-size: 15px; line-height: 1.1; }
.brand-txt small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
.side-scroll { flex: 1; overflow-y: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.side-h { display: flex; align-items: center; padding: 18px 8px 8px; }
.side-h .cap { font-size: 11px; color: var(--dim); letter-spacing: .08em; }
.side-add { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--dim); color: var(--muted); display: grid; place-items: center; font-size: 15px; line-height: 1; margin-left: auto; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; text-align: left; width: 100%; position: relative; }
.nav-item:hover { background: rgba(58, 70, 91, 0.25); }
.nav-item.on { background: rgba(58, 70, 91, 0.5); }
.nav-item.on::before { content: ""; position: absolute; left: -12px; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; background: var(--teal); }
.nav-item .nm { font-family: var(--font-head); font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .mini { font-family: var(--font-data); font-size: 10px; color: var(--muted); display: grid; grid-template-columns: 1fr auto; gap: 0 6px; margin-top: 2px; }
.nav-item .mini b { color: var(--fg); font-weight: 700; }
.nav-simple { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 12px; font-family: var(--font-head); font-weight: 600; font-size: 13px; letter-spacing: .02em; width: 100%; text-align: left; }
.nav-simple:hover { background: rgba(58, 70, 91, 0.25); }
.lav { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-head); font-weight: 800; font-size: 12px; color: var(--teal-ink); flex: none; }
.me-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
.me-bar b { font-family: var(--font-head); font-size: 14px; }
.gear { width: 36px; height: 36px; border-radius: 8px; background: var(--raise); display: grid; place-items: center; color: var(--muted); flex: none; }
.gear:hover { color: var(--fg); }
.gear svg { width: 18px; height: 18px; }

.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0 12px 16px 20px; }
.lg-head { height: 84px; display: flex; align-items: center; gap: 12px; flex: none; flex-wrap: nowrap; min-width: 0; }
.lg-head h1 { margin: 0; font-family: var(--font-head); font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lg-head .subt { font-family: var(--font-data); font-weight: 600; font-size: 15px; color: var(--sub); white-space: nowrap; }
.clock { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.clock .when { font-family: var(--font-data); font-size: 12px; color: var(--muted); text-align: right; line-height: 1.2; margin-right: 4px; }
.clock .when b { color: var(--fg); font-weight: 700; display: block; font-size: 13px; }
.panel { background: var(--panel); border-radius: 16px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 6px; padding: 24px 24px 0; overflow-x: auto; scrollbar-width: none; flex: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 13px; border-radius: 8px; background: var(--sport-10); color: var(--sport); font-family: var(--font-head); font-size: 12px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; flex: none; }
.tab svg { width: 14px; height: 14px; flex: none; }
.tab.on { background: var(--sport); color: var(--teal-ink); }
.tab .badge { min-width: 16px; height: 16px; border-radius: 8px; background: var(--pink); color: #fff; font-size: 10px; display: inline-grid; place-items: center; padding: 0 4px; font-family: var(--font-data); }
.tab.on .badge { background: var(--teal-ink); color: var(--sport); }
.view { flex: 1; overflow-y: auto; padding: 20px 24px 28px; min-height: 0; }
.stack { display: flex; flex-direction: column; gap: 18px; }

/* ---------- buttons, chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 8px; background: var(--raise); color: var(--fg); font-family: var(--font-head); font-size: 12px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.btn:hover { filter: brightness(1.15); }
.btn.teal { background: var(--teal); color: var(--teal-ink); }
.btn.ghost { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.btn.pinkb { background: rgba(255, 42, 109, .14); color: var(--pink); }
.btn.sm { height: 26px; padding: 0 10px; font-size: 11px; }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.addbtn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--teal); font-size: 20px; font-weight: 400; line-height: 1; }
.addbtn:hover { background: var(--teal-10); }
.pills { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.pill { height: 26px; padding: 0 12px; border-radius: 13px; background: var(--chip); color: var(--muted); font-family: var(--font-head); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.pill.on { background: #4a5568; color: var(--fg); }
.pill.punt.on { background: rgba(255, 42, 109, .18); color: var(--pink); text-decoration: line-through; }
.wk { height: 30px; padding: 0 14px; border-radius: 8px; background: var(--raise); font-family: var(--font-head); font-size: 12px; font-weight: 800; letter-spacing: .01em; display: inline-flex; align-items: center; gap: 8px; }
.wk button { color: var(--muted); font-size: 14px; padding: 0 2px; }
.wk button:disabled { opacity: .3; }
.search { height: 30px; background: var(--chip); border: 0; border-radius: 15px; padding: 0 14px; font-family: var(--font-data); font-size: 12px; width: 200px; max-width: 100%; }
.search::placeholder { color: var(--dim); }
.check { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-data); font-size: 12px; color: var(--soft); cursor: pointer; }
.check input { accent-color: var(--teal); width: 14px; height: 14px; }
.sec-h { display: flex; align-items: center; gap: 10px; }
.sec-h h2 { margin: 0; font-family: var(--font-head); font-size: 16px; font-weight: 500; }
.note { font-family: var(--font-data); font-size: 11px; color: var(--dim); line-height: 1.45; }
.box { background: var(--card); border-radius: 16px; }
.box-pad { padding: 16px; }
.callout { background: var(--card); border-radius: 12px; padding: 12px 14px; font-family: var(--font-data); font-size: 12px; color: var(--soft); line-height: 1.5; }
.callout b { color: var(--teal); font-weight: 700; }

/* ---------- avatars ---------- */
.av { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; font-family: var(--font-head); font-weight: 800; font-size: 11px; color: var(--teal-ink); flex: none; }
.av.lg { width: 44px; height: 44px; font-size: 14px; }
.av.xl { width: 64px; height: 64px; font-size: 20px; }
.pav { --c1: #3a465b; --c2: #a3bbd3; width: 32px; height: 32px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; background: linear-gradient(160deg, var(--c1) 0 62%, color-mix(in srgb, var(--c1) 70%, #000) 100%); box-shadow: inset 0 0 0 2px var(--c2); color: #fff; font-family: var(--font-head); font-weight: 700; font-size: 11px; letter-spacing: .02em; text-shadow: 0 1px 1px rgba(0,0,0,.4); overflow: hidden; }
.pav img { width: 100%; height: 100%; object-fit: cover; }
.pav.sm { width: 26px; height: 26px; font-size: 9px; }
.pav.xl { width: 72px; height: 72px; font-size: 22px; box-shadow: inset 0 0 0 3px var(--c2); }

/* ---------- position badges ---------- */
.pos { width: 42px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; font-family: var(--font-base); font-weight: 900; font-size: 11px; color: var(--teal-ink); flex: none; letter-spacing: .02em; }
.pos-PG { background: var(--c-pg); } .pos-SG { background: var(--c-sg); } .pos-SF { background: var(--c-sf); } .pos-PF { background: var(--c-pf); } .pos-C { background: var(--c-c); color: #fff; }
.pos-G { background: linear-gradient(90deg, var(--c-pg) 50%, var(--c-sg) 50%); }
.pos-F { background: linear-gradient(90deg, var(--c-sf) 50%, var(--c-pf) 50%); }
.pos-UTIL { background: linear-gradient(90deg, var(--c-pg) 0 20%, var(--c-sg) 20% 40%, var(--c-sf) 40% 60%, var(--c-pf) 60% 80%, var(--c-c) 80%); font-size: 10px; }
.pos-BN { background: var(--muted); }
.pos-IR { background: var(--chip); color: var(--pink); }
.pos-TX { background: var(--chip); color: var(--gold); }
.ppos { font-family: var(--font-data); font-size: 10px; color: var(--muted); letter-spacing: .02em; }
.ppos .t-PG { color: var(--c-pg); } .ppos .t-SG { color: var(--c-sg); } .ppos .t-SF { color: var(--c-sf); } .ppos .t-PF { color: var(--c-pf); } .ppos .t-C { color: var(--c-c); }
.pname { font-family: var(--font-data); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pname:hover { color: var(--teal); }
.rook { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 3px; background: var(--gold); color: var(--teal-ink); font-size: 9px; font-weight: 900; margin-left: 4px; vertical-align: 1px; font-family: var(--font-base); }

/* ---------- matchup ---------- */
.owners { display: grid; grid-template-columns: minmax(0, 1fr) 36px minmax(0, 1fr); align-items: center; gap: 6px; }
.ocard { background: var(--card); border-radius: 26px; padding: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; cursor: pointer; }
.ocard.r { grid-template-columns: auto minmax(0, 1fr) auto; text-align: right; }
.ocard .un { font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.ocard .tn { font-family: var(--font-head); font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ocard .sc { font-family: var(--font-data); font-weight: 800; font-size: 26px; line-height: 1; }
.ocard .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: rgba(163,187,211,.12); position: relative; overflow: hidden; }
.ocard .bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px; }
.ocard.r .bar i { left: auto; right: 0; }
.ocard .meta { grid-column: 1 / -1; display: flex; gap: 8px; font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.ocard.r .meta { justify-content: flex-end; }
.ocard .meta b { color: var(--fg); }
.vs { width: 36px; height: 36px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-family: var(--font-head); font-size: 11px; font-weight: 700; color: var(--muted); }
.yet { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 11px; color: var(--muted); padding: 0 8px; }
.yet b { color: var(--blue); font-weight: 600; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); align-items: center; gap: 4px; }
.mcell { background: var(--card); border-radius: 12px; padding: 10px 14px; min-height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
.mcell.r { text-align: right; align-items: flex-end; }
.mcircle { width: 34px; height: 34px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-family: var(--font-data); font-size: 10px; font-weight: 700; color: var(--teal); margin: 0 auto; letter-spacing: .02em; }
.cval { font-family: var(--font-data); font-weight: 700; font-size: 18px; }
.cval.win { color: var(--teal); }
.cval.tie { color: var(--gold); }
.cval .mk { font-weight: 500; font-size: 11px; color: var(--muted); margin: 0 6px; }
.lead { font-family: var(--font-data); font-size: 10px; color: var(--muted); }
.prow { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mcell.r .prow { flex-direction: row-reverse; }
.prow .who { min-width: 0; display: flex; flex-direction: column; }
.stat { font-family: var(--font-data); font-size: 11px; color: var(--soft); line-height: 1.4; }
.stat .opp { color: var(--muted); margin-right: 4px; }
.stat.dnp { color: var(--dim); }
.mcell.bench { opacity: .5; }
.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.day { flex: none; height: 30px; padding: 0 10px; border-radius: 8px; background: var(--chip); color: var(--muted); font-family: var(--font-head); font-size: 11px; font-weight: 700; }
.day.on { background: var(--teal); color: var(--teal-ink); }
.day.today:not(.on) { color: var(--teal); }
.lmatch { display: grid; grid-template-columns: minmax(0, 1fr) 36px minmax(0, 1fr); align-items: center; gap: 6px; }
.lmatch .ocard { padding: 12px 14px; border-radius: 22px; }
.lmatch .ocard .tn { font-size: 13px; }
.lmatch .ocard .sc { font-size: 20px; }

/* ---------- tables ---------- */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-family: var(--font-data); font-size: 12px; }
.tbl th { font-family: var(--font-base); font-weight: 400; font-size: 11px; color: var(--soft); text-align: right; padding: 8px 6px; white-space: nowrap; position: sticky; top: 0; background: #262d3d; z-index: 1; }
.tbl th.l { text-align: left; }
.tbl th.sort { cursor: pointer; }
.tbl th.sort.on { color: var(--teal); }
.tbl th.grp { color: var(--fg); font-family: var(--font-head); font-weight: 600; font-size: 11px; text-align: center; background: transparent; position: static; padding-bottom: 0; }
.tbl td { padding: 7px 5px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); }
.tbl td.l { text-align: left; }
.tbl tr.alt td { background: rgba(163,187,211,.025); }
.tbl td.hl, .tbl th.hl { color: var(--teal); }
.tbl td.punted { opacity: .3; }
.tbl tbody tr:hover td { background: rgba(163,187,211,.06); }
.scroll-x { overflow-x: auto; }
.prow-t { display: flex; align-items: center; gap: 10px; min-width: 0; }
.prow-t .who { display: flex; flex-direction: column; min-width: 0; }
.today { font-family: var(--font-data); font-size: 10px; color: var(--teal); }
.today.no { color: var(--dim); }
.inelig { color: var(--pink); }
.zc { display: inline-block; min-width: 32px; padding: 2px 3px; border-radius: 4px; }
.pills { flex-wrap: nowrap; }
.filters-wrap .pills { flex-wrap: wrap; }
.wk { white-space: nowrap; }
@media (max-width: 1500px) { .hide-md { display: none !important; } }

/* ---------- league ---------- */
.stand { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.stand:first-child { border-top: 0; }
.stand .rk { font-family: var(--font-data); font-weight: 700; color: var(--muted); }
.stand .rec { font-family: var(--font-data); font-weight: 800; font-size: 15px; }
.stand.cut { border-bottom: 2px dashed var(--teal); }
.form { display: inline-flex; gap: 3px; }
.form i { width: 6px; height: 6px; border-radius: 50%; }
.kv { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 0; }
.kv > div { padding: 11px 14px; border-top: 1px solid var(--line); font-family: var(--font-data); font-size: 12px; }
.kv > div:nth-child(-n+2) { border-top: 0; }
.kv .k { color: var(--muted); font-weight: 600; }

/* ---------- trades & z-bars ---------- */
.zrow { display: grid; grid-template-columns: 40px 1fr 44px; gap: 10px; align-items: center; font-family: var(--font-data); font-size: 11px; }
.zrow .lab { font-weight: 700; color: var(--muted); }
.ztrack { height: 8px; background: var(--chip); border-radius: 4px; position: relative; overflow: hidden; }
.ztrack .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(163,187,211,.3); }
.ztrack .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.asset { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.asset:hover { background: var(--card); }
.asset input { accent-color: var(--teal); width: 16px; height: 16px; flex: none; }
.asset .val { margin-left: auto; font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.pickchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(249,199,79,.12); color: var(--gold); font-family: var(--font-head); font-size: 11px; font-weight: 700; white-space: nowrap; }
.assetchip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 22px; background: var(--card-2); cursor: pointer; }
.assetchip b { font-family: var(--font-data); font-size: 12px; }
